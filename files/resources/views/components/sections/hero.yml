# The visual editor's contract for sections/hero.blade.php.
title: Hero
description: The opening statement — the identity chip, the headline, two actions and the availability line
fields:
    greeting:
        type: text
        label: Greeting
        description: The first line of the chip. Introduce yourself the way you would out loud.
        default: "Hello, I’m Harlow"
    role:
        type: text
        label: Role
        description: The second line of the chip — what you do and where.
        default: "Developer/Designer"
    avatar:
        type: image
        label: Avatar
        description: A tight square head crop — it renders at 44px inside the lime ring.
        default: "/images/portrait.jpg"
    avatarAlt:
        type: text
        label: Avatar alt text
        default: "Harlow Quinn"
    heading:
        type: textarea
        label: Headline
        description: The chip already says who you are, so make this about the work.
        rows: 2
        default: "Design and front-end, in one pair of hands."
    intro:
        type: textarea
        label: Intro
        rows: 4
        default: "I work with small teams on identity, product and the websites in between — one project at a time, start to finish."
    primaryText:
        type: text
        label: Primary button text
        default: "See selected work"
    primaryHref:
        type: url
        label: Primary button link
        default: "/work"
    secondaryText:
        type: text
        label: Secondary link text
        default: "Read the writing"
    secondaryHref:
        type: url
        label: Secondary link
        default: "/writing"
    status:
        type: text
        label: Availability
        description: The line beside the lime dot, under the buttons.
        default: "Available for one project from March"
